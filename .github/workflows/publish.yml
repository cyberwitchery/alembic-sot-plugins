name: publish

# a v* tag publishes all three packages at the tag's version. they release in
# lockstep: the plugins pin alembic-runner to the same version, so it goes
# first. each package publishes from its own environment: pypi trusts one
# publisher per repository, workflow and environment.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: check versions
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os, tomllib
          want = os.environ["REF_NAME"].removeprefix("v")
          bad = []
          for package in ("alembic-runner", "netbox-alembic", "nautobot-alembic"):
              with open(f"{package}/pyproject.toml", "rb") as f:
                  project = tomllib.load(f)["project"]
              if project["version"] != want:
                  bad.append(f"{package} is {project['version']}")
              for dep in project["dependencies"]:
                  if dep.startswith("alembic-runner") and dep != f"alembic-runner=={want}":
                      bad.append(f"{package} depends on {dep}")
          if bad:
              raise SystemExit(f"tag {want} does not match: " + "; ".join(bad))
          EOF
      - name: build
        run: |
          pip install build
          for package in alembic-runner netbox-alembic nautobot-alembic; do
            python -m build -o "dist/$package" "$package"
          done
      - name: generate sbom
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          pip install cyclonedx-bom
          python -m pip freeze --all | cyclonedx-py requirements - -o "/tmp/sbom-${REF_NAME}.cdx.json"
      - name: upload sbom
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.ref_name }}
          path: /tmp/sbom-${{ github.ref_name }}.cdx.json
      - name: attach sbom to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: /tmp/sbom-${{ github.ref_name }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-runner:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-alembic-runner
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/alembic-runner/

  publish-netbox:
    needs: publish-runner
    runs-on: ubuntu-latest
    environment: pypi-netbox-alembic
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/netbox-alembic/

  publish-nautobot:
    needs: publish-runner
    runs-on: ubuntu-latest
    environment: pypi-nautobot-alembic
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/nautobot-alembic/
