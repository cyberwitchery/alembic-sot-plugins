name: publish

# a v* tag publishes all three packages at the tag's version. they release in
# lockstep: the plugins pin alembic-runner to the same version, so it goes
# first. each package publishes from its own environment: pypi trusts one
# publisher per repository, workflow and environment.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: check versions
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os, tomllib
          want = os.environ["REF_NAME"].removeprefix("v")
          bad = []
          for package in ("alembic-runner", "netbox-alembic", "nautobot-alembic"):
              with open(f"{package}/pyproject.toml", "rb") as f:
                  project = tomllib.load(f)["project"]
              if project["version"] != want:
                  bad.append(f"{package} is {project['version']}")
              for dep in project["dependencies"]:
                  if dep.startswith("alembic-runner") and dep != f"alembic-runner=={want}":
                      bad.append(f"{package} depends on {dep}")
          if bad:
              raise SystemExit(f"tag {want} does not match: " + "; ".join(bad))
          EOF

  # builds, gates and attests the packages the publish jobs upload.
  sbom:
    needs: check
    uses: cyberwitchery/.github/.github/workflows/sbom.yml@64ffd6a08c3e9626a681c8be1c8ad056765f3b85 # main
    permissions:
      contents: read
    with:
      mode: release
      ecosystem: python
      packages: alembic-runner netbox-alembic nautobot-alembic

  attest:
    name: attest
    needs: sbom
    uses: cyberwitchery/.github/.github/workflows/attest.yml@64ffd6a08c3e9626a681c8be1c8ad056765f3b85 # main
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      names: ${{ needs.sbom.outputs.names }}

  release:
    needs: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-evidence
          path: evidence
      - name: attach sbom to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: evidence/release/*.cdx.json

  publish-runner:
    needs: sbom
    runs-on: ubuntu-latest
    environment: pypi-alembic-runner
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-evidence
          path: evidence
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: evidence/packages/alembic-runner/

  publish-netbox:
    needs: publish-runner
    runs-on: ubuntu-latest
    environment: pypi-netbox-alembic
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-evidence
          path: evidence
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: evidence/packages/netbox-alembic/

  publish-nautobot:
    needs: publish-runner
    runs-on: ubuntu-latest
    environment: pypi-nautobot-alembic
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-evidence
          path: evidence
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: evidence/packages/nautobot-alembic/
