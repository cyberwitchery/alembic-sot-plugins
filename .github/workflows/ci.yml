name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # the alembic release the plugins are checked against. bump it deliberately,
  # together with alembic_runner.SUPPORTED.
  ALEMBIC_VERSION: v0.10.0
  ALEMBIC_TARGET: x86_64-unknown-linux-gnu

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
      - run: ruff format --check

  runner:
    name: alembic-runner (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: fetch the alembic cli
        run: |
          name="alembic-${ALEMBIC_VERSION}-${ALEMBIC_TARGET}"
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/cyberwitchery/alembic/releases/download/${ALEMBIC_VERSION}/${name}.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.local/bin" "${name}/alembic"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install
        run: pip install -e "alembic-runner[dev]" alembic-adapter-sdk
      - name: test
        working-directory: alembic-runner
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report

  netbox:
    name: netbox ${{ matrix.netbox }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the floor, and the current release.
        netbox: ["v4.6.2", "v4.7.1"]
    env:
      NETBOX_IMAGE: docker.io/netboxcommunity/netbox:${{ matrix.netbox }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: start netbox
        run: dev/compose up -d --build --wait --wait-timeout 600
      - name: migrations are complete
        run: dev/manage makemigrations netbox_alembic --check --dry-run
      - name: unit tests
        run: dev/manage test netbox_alembic --noinput
      - name: end to end
        run: dev/e2e.sh
      - name: logs
        if: failure()
        run: dev/compose logs --tail 200

  nautobot:
    name: nautobot 3.2.5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: start nautobot
        run: dev/nautobot-compose up -d --build --wait --wait-timeout 900
      - name: migrations are complete
        run: dev/nautobot-manage makemigrations nautobot_alembic --check --dry-run
      - name: unit tests
        run: dev/nautobot-manage test nautobot_alembic --noinput
      - name: end to end
        run: dev/nautobot-e2e.sh
      - name: logs
        if: failure()
        run: dev/nautobot-compose logs --tail 200

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: |
          for package in alembic-runner netbox-alembic nautobot-alembic; do
            python -m build -o dist "$package"
          done
      - run: twine check --strict dist/*

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r docs/requirements.txt
      - run: mkdocs build --strict

  sbom:
    name: sbom
    uses: cyberwitchery/.github/.github/workflows/sbom.yml@64ffd6a08c3e9626a681c8be1c8ad056765f3b85 # main
    with:
      mode: report
      ecosystem: python
      packages: alembic-runner netbox-alembic nautobot-alembic

  success:
    name: success
    needs: [lint, runner, netbox, nautobot, build, docs, sbom]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: check results
        # skipped counts as failure: every job in needs runs unconditionally,
        # so a skip only ever means an upstream job broke.
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            exit 1
          fi
