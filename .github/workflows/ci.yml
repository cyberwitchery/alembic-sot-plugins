name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # the alembic release the plugins are checked against. bump it deliberately,
  # together with alembic_runner.SUPPORTED.
  ALEMBIC_VERSION: v0.10.0
  ALEMBIC_TARGET: x86_64-unknown-linux-gnu

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3
      - run: ruff format --check

  runner:
    name: alembic-runner (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: fetch the alembic cli
        run: |
          name="alembic-${ALEMBIC_VERSION}-${ALEMBIC_TARGET}"
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/cyberwitchery/alembic/releases/download/${ALEMBIC_VERSION}/${name}.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.local/bin" "${name}/alembic"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install
        run: pip install -e "alembic-runner[dev]" alembic-adapter-sdk
      - name: test
        working-directory: alembic-runner
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report

  netbox:
    name: netbox ${{ matrix.netbox }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the floor, and the current release.
        netbox: ["v4.6.2", "v4.7.1"]
    env:
      NETBOX_IMAGE: docker.io/netboxcommunity/netbox:${{ matrix.netbox }}
    steps:
      - uses: actions/checkout@v6
      - name: start netbox
        run: dev/compose up -d --build --wait --wait-timeout 600
      - name: migrations are complete
        run: dev/manage makemigrations netbox_alembic --check --dry-run
      - name: unit tests
        run: dev/manage test netbox_alembic --noinput
      - name: end to end
        run: dev/e2e.sh
      - name: logs
        if: failure()
        run: dev/compose logs --tail 200

  nautobot:
    name: nautobot 3.2.5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: start nautobot
        run: dev/nautobot-compose up -d --build --wait --wait-timeout 900
      - name: migrations are complete
        run: dev/nautobot-manage makemigrations nautobot_alembic --check --dry-run
      - name: unit tests
        run: dev/nautobot-manage test nautobot_alembic --noinput
      - name: end to end
        run: dev/nautobot-e2e.sh
      - name: logs
        if: failure()
        run: dev/nautobot-compose logs --tail 200

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: |
          for package in alembic-runner netbox-alembic nautobot-alembic; do
            python -m build -o dist "$package"
          done
      - run: twine check --strict dist/*

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r docs/requirements.txt
      - run: mkdocs build --strict

  success:
    name: success
    needs: [lint, runner, netbox, nautobot, build, docs]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
