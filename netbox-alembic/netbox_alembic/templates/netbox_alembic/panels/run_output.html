{% extends "ui/panels/_base.html" %}
{% load i18n %}

{% block panel_content %}
  {% if object.output %}
    <details class="card-body"{% if show_output %} open{% endif %}>
      <summary>{% trans "Output from alembic" %}</summary>
      <pre class="mt-2 mb-0">{{ object.output }}</pre>
    </details>
  {% else %}
    <div class="card-body text-muted">{% trans "No output yet." %}</div>
  {% endif %}
{% endblock panel_content %}
